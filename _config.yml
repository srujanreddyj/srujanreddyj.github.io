# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/

title: Systems in Practice
description: Senior data engineer building reliable data platforms, lakehouses, and analytical systems.
github_username: srujanreddyj

author: Srujan Jabbireddy
#avatar: /logo.png
email: jsrujanreddy@gmail.com


# Email and twitter are optional:
email: jsrujanreddy@gmail.com
twitter_username:
linkedin_username: srujan-reddy 

# Set this to true to get LaTeX math equation support
use_math: true

# Add your Google Analytics ID here if you have one and want to use it
google_analytics: UA-157263530-1

# Everything below here can be ignored, unless you want to change the theme entirely
# The Hamilton theme's files live in this repo (_layouts, _includes, _sass), so
# no theme is downloaded at build time. Plugins come from the Gemfile's
# :jekyll_plugins group; the ones named here are the ones this site relies on.
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-octicons
  - jekyll-github-metadata
  - jekyll-sitemap
  - jekyll-redirect-from

# Settings the old "github-pages" gem applied silently, now written down.
future: true
gist:
  noscript: false
sass:
  style: compact   # one line per CSS rule, as before

feed:
  excerpt_only: true

reader_library_url: "https://systems-in-practice-library.jsrujanreddy.workers.dev"

exclude:
  - vendor/
  - .bundle/
  - node_modules/
  - Gemfile
  - Gemfile.lock
  - deployment/
  - scripts/
  - tests/
  - .github/
  - social/
  - wrangler.jsonc
  - README.md
  - jekyll-theme-hamilton.gemspec
  # Preserve downloadable Cursor rule front matter in source and the ZIP bundle.
  - notes/cursor-abstractions/
  # Reference documents: excluded from the site, but still visible in this repository.
  - presentations/
  - references/
  - references.md

titles_from_headings:
  enabled:     true
  strip_title: true
  collections: true

highlighter: rouge
markdown: kramdown
kramdown:
  # mathjax, as the old github-pages gem forced; katex would need an extra gem.
  math_engine: mathjax
  input: GFM
  auto_ids: true
  gfm_quirks: paragraph_end
  syntax_highlighter_opts:
    default_lang: plaintext
  hard_wrap: false
  syntax_highlighter: rouge
