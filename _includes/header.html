<div class="wrapper">
  <a class="skip-link" href="#site-main">Skip to content</a>
  <a class="site-title" rel="author" href="{{ '/' | relative_url }}"><span class="site-title-primary">{{ site.title | escape }}</span></a>
  <nav class="primary-nav" aria-label="Main navigation">
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="main-menu" hidden>Menu</button>
    <ul id="main-menu">{% for nav in site.data.navigation %}<li><a href="{{ nav.url | relative_url }}" {% if page.url == nav.url %}aria-current="page"{% endif %}>{{ nav.title | escape }}</a></li>{% endfor %}</ul>
  </nav>
  <button class="theme-toggle" type="button" aria-label="Switch color theme"><span class="theme-toggle-light" aria-hidden="true">☀</span><span class="theme-toggle-dark" aria-hidden="true">☾</span></button>
</div>
<script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
